<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment - HealthCare++</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg sticky-top shadow-sm bg-white">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="bi bi-heart-pulse-fill"></i> HealthCare++
    </a>
  </div>
</nav>

<div class="container my-5">
  <div class="mx-auto p-4 shadow-sm bg-white" style="max-width:450px;border-radius:10px;">
    <h3 class="text-center mb-3">Book Appointment</h3>

    <form id="bookingForm">
      <div class="mb-3">
        <label class="form-label">Doctor</label>
        <input type="text" id="doctorName" class="form-control" readonly>
      </div>

      <!-- REMOVED the Your Name input, we use currentUser from localStorage instead -->

      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" id="date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Time</label>
        <select id="time" class="form-select" required>
          <option value="">Select time</option>
        </select>
      </div>

      <button class="btn btn-primary w-100">Confirm Appointment</button>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="scripts/booking.js"></script>
<script src="scripts/config.js"></script>
   <script src="scripts/login.js"></script>

</body>
</html>
