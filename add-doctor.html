<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Doctor - HealthCare++</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles/add-doctor.css">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="scripts/config.js"></script>
   <script src="scripts/login.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-heart-pulse-fill"></i> HealthCare++
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-center">

          <!-- BACK TO MANAGER PANEL -->
          <li class="nav-item ms-lg-3">
            <a class="btn btn-secondary" href="managerpanel.html">Back</a>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="form-container mx-auto">
      <h2 class="mb-4 text-center">Add New Doctor</h2>
      <form id="doctorForm" class="d-flex flex-column gap-3">
        <input type="text" id="name" class="form-control" placeholder="Name" required>
        <input type="text" id="surname" class="form-control" placeholder="Surname" required>
        <input type="text" id="specialty" class="form-control" placeholder="Medical Specialty" required>
        <input type="number" id="wage" class="form-control" placeholder="Wage ($)" required>
        <button type="submit" class="btn btn-primary">Save Doctor</button>
      </form>
    </div>
  </main>

  <!-- ADMIN CHECK -->
  <script>
    const user = JSON.parse(localStorage.getItem("currentUser"));
    if (!user || user.email !== "admin@care.com") {
        alert("Access denied. Admin only.");
        window.location.href = "index.html";
    }
  </script>

  <script src="scripts/add-doctor.js"></script>
</body>
</html>
