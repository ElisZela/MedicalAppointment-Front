<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Panel - HealthCare++</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles/managerpanel.css">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-heart-pulse-fill"></i> HealthCare++
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-center">

          <!-- KEEP: Admin needs access to Add Doctor -->
          <li class="nav-item ms-lg-3">
            <a class="btn btn-primary" href="add-doctor.html">Add Doctor</a>
          </li>

          <li class="nav-item ms-lg-3">
            <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="mb-4 text-center">Doctor Management</h2>

    <div class="table-responsive">
      <table class="table" id="doctorTable">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Specialty</th>
            <th>Wage ($)</th>
            <th>Edit</th>
            <th>Remove</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- ADMIN CHECK + LOGOUT -->
  <script>
    const user = JSON.parse(localStorage.getItem("currentUser"));
    if (!user || user.email !== "admin@care.com") {
        alert("Access denied. Admin only.");
        window.location.href = "index.html";
    }

    $("#logoutBtn").click(function () {
        localStorage.removeItem("currentUser");
        window.location.href = "login.html";
    });
  </script>

  <script src="scripts/managerpanel.js"></script>
</body>
</html>
